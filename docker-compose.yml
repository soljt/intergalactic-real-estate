version: '3.8'
services:             
    cosc304-sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        container_name: cosc304-sqlserver
        restart: always
        environment:
            ACCEPT_EULA: 'Y'
            # Express is the free edition licensed for production use.
            MSSQL_PID: Express
            # From .env, which is not in git; see .env.example.
            MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
        volumes:
            - mssql-data:/var/opt/mssql
        networks:
            network304:
                aliases:
                    - cosc304_sqlserver
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        image: cosc304-java
        depends_on:
            - cosc304-sqlserver
        container_name: cosc304-java
        restart: unless-stopped
        environment:
            # Read by the JSPs (System.getenv) to log in to the database.
            DB_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
        volumes:
            - ./WebContent:/usr/local/tomcat/webapps/shop/
        networks:
            network304:
                aliases:
                    - cosc304-java
            # The edge proxy (soljt/edge-proxy) reaches the app here.
            web:
                aliases:
                    - realspace-app
        expose:
            - "8080"

volumes:
    mssql-data:
networks:
    network304:
    web:
        external: true