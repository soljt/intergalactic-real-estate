version: '3.8'
services:             
    cosc304-postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        container_name: cosc304-postgres
        restart: always
        environment:
            POSTGRES_DB: orders
            # From .env, which is not in git; see .env.example. The superuser
            # only uses it while the database is created, then db/init drops it.
            POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
            DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./db/init:/docker-entrypoint-initdb.d:ro
        networks:
            - network304
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        image: cosc304-java
        depends_on:
            - cosc304-postgres
        container_name: cosc304-java
        restart: unless-stopped
        environment:
            # Read by the JSPs (System.getenv) to log in to the database.
            DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        volumes:
            - ./WebContent:/usr/local/tomcat/webapps/shop/
        networks:
            network304:
                aliases:
                    - cosc304-java
            # The edge proxy (soljt/edge-proxy) reaches the app here.
            web:
                aliases:
                    - realspace-app
        expose:
            - "8080"

volumes:
    postgres-data:
networks:
    network304:
    web:
        external: true