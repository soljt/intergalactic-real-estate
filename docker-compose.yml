version: '3.8'
services:             
    cosc304-sqlserver:
        image: mcr.microsoft.com/azure-sql-edge
        container_name: cosc304-sqlserver
        restart: always
        environment:
            ACCEPT_EULA: 'Y'
            # From .env, which is not in git; see .env.example.
            SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
        volumes:
            - cosc304-db:/var/lib/mssql            
            - ./WebContent/ddl:/scripts
        networks:
            network304:
                aliases:
                    - cosc304_sqlserver
        command:
            - /bin/bash
            - -c
            - |
               /opt/mssql/bin/sqlservr &
               pid=$$!
               echo "Waiting for MS SQL to be available"
               /opt/mssql-tools/bin/sqlcmd -l 30 -S localhost -h-1 -V1 -U sa -P $$SA_PASSWORD -Q "SET NOCOUNT ON SELECT \"YAY WE ARE UP\" , @@servername"
               is_up=$$?
               while [ $$is_up -ne 0 ] ; do 
                 echo -e $$(date) 
                 /opt/mssql-tools/bin/sqlcmd -l 30 -S localhost -h-1 -V1 -U sa -P $$SA_PASSWORD -Q "SET NOCOUNT ON SELECT \"YAY WE ARE UP\" , @@servername"
                 is_up=$$?
                 sleep 5 
               done
               for foo in /scripts/SQLServer*.ddl
                 do /opt/mssql-tools/bin/sqlcmd -U sa -P $$SA_PASSWORD -l 30 -e -i $$foo
               done
               trap "kill -15 $$pid" SIGTERM
               wait $$pid
               exit 0         
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        image: cosc304-java
        depends_on:
            - cosc304-sqlserver
        container_name: cosc304-java
        restart: unless-stopped
        environment:
            # Read by the JSPs (System.getenv) to log in to the database.
            DB_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
        volumes:
            - ./WebContent:/usr/local/tomcat/webapps/shop/
        networks:
            network304:
                aliases:
                    - cosc304-java
            # The edge proxy (soljt/edge-proxy) reaches the app here.
            web:
                aliases:
                    - realspace-app
        expose:
            - "8080"

volumes: 
    cosc304-db:
    mysql-db:
networks:
    network304:
    web:
        external: true