# Redirect HTTP -> HTTPS for both hostnames
server {
    listen 80;
    server_name soljt.ch www.soljt.ch realspace.soljt.ch;
    return 301 https://$host$request_uri;
}

# Portfolio (static)
server {
    listen 443 ssl http2;
    server_name soljt.ch www.soljt.ch;

    ssl_certificate     /etc/ssl/soljt/fullchain.pem;
    ssl_certificate_key /etc/ssl/soljt/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Realspace (proxy to the app container)
server {
    listen 443 ssl http2;
    server_name realspace.soljt.ch;

    ssl_certificate     /etc/ssl/soljt/fullchain.pem;    
    ssl_certificate_key /etc/ssl/soljt/private.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    client_max_body_size 100M;  # adjust if you serve large uploads
}
